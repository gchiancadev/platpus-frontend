
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pessoas · Platpus</title>
</head>

<body>

    <header class="cabecalho-pagina">

        <nav aria-label="Navegação principal">
            <ul>
                <li>
                    <a href="pessoas.html" aria-current="page">
                        Pessoas
                    </a>
                </li>
            </ul>
        </nav>

        <h1>Pessoas</h1>

        <div class="acoes-pagina">
            <a
                class="btn btn-primario"
                href="pessoas-form.html"
                data-papel="coordenador gestor"
            >
                Cadastrar
            </a>
        </div>

    </header>

    <main>

        <!-- Formulário de filtros -->
        <form
            class="filtros"
            role="search"
            action="pessoas.html"
            method="get"
        >

            <label for="busca-pessoa">
                Buscar por nome ou RA
            </label>

            <input
                type="search"
                name="busca"
                id="busca-pessoa"
                placeholder="Digite um nome ou RA"
            >

            <label for="filtro-papel">
                Filtrar por papel
            </label>

            <select name="papel" id="filtro-papel">
                <option value="">Todos</option>
                <option value="coordenador">Coordenador</option>
                <option value="gestor">Gestor PMO</option>
                <option value="colaborador">Colaborador</option>
            </select>

            <label for="filtro-grupo">
                Filtrar por grupo
            </label>

            <select name="grupo" id="filtro-grupo">
                <option value="">Todos</option>
                <option value="sem">Sem grupo</option>
                <option value="grupo-a">Grupo A</option>
                <option value="grupo-b">Grupo B</option>
            </select>

            <button type="submit">
                Filtrar
            </button>

        </form>

        <!-- Tabela de pessoas -->
        <table class="tabela">

            <caption>
                Clique no nome para abrir o perfil
            </caption>

            <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">RA e Matrícula</th>
                    <th scope="col">Papel</th>
                    <th scope="col">Grupo</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>
                        <a href="pessoa-perfil.html">
                            Ana Beatriz
                        </a>
                    </td>
                    <td>202601</td>
                    <td>Colaborador</td>
                    <td>Grupo A</td>
                </tr>

                <tr>
                    <td>
                        <a href="pessoa-perfil.html">
                            Mariana Reis
                        </a>
                    </td>
                    <td>202602</td>
                    <td>Colaborador</td>
                    <td>Sem grupo</td>
                </tr>

                <tr>
                    <td>
                        <a href="pessoa-perfil.html">
                            Eduardo Faria
                        </a>
                    </td>
                    <td>100310</td>
                    <td>Gestor PMO</td>
                    <td>Grupo B</td>
                </tr>

                <tr>
                    <td>
                        <a href="pessoa-perfil.html">
                            Rita Moura
                        </a>
                    </td>
                    <td>100001</td>
                    <td>Coordenador</td>
                    <td>&mdash;</td>
                </tr>

            </tbody>

        </table>

    </main>

</body>
</html>
